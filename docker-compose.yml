services:
  app:
    build: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-chiappa}
      DB_USERNAME: ${DB_USERNAME:-chiappa}
      DB_PASSWORD: ${DB_PASSWORD:-chiappa}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "php artisan migrate --seed --force && php artisan storage:link || true; php-fpm"
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chiappa}
      MYSQL_USER: ${DB_USERNAME:-chiappa}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chiappa}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  storage_data:
